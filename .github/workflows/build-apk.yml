name: Build ARTORA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ARTORA project
        run: |
          unzip -q artora.zip -d project

      - name: Find Android project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "ANDROID_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTORA-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
