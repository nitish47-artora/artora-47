name: Build ARTORA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ARTORA ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q artora.zip -d project

      - name: Extract inner ARTORA ZIP
        run: |
          mkdir -p project/artora
          unzip -q project/artora-47-main/artora.zip -d project/artora

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd project/artora/android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTORA-debug-APK
          path: project/artora/android/app/build/outputs/apk/debug/*.apk
