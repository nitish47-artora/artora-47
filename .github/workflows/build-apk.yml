name: Build ARTORA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ARTORA project
        run: |
          unzip -q artora.zip -d project

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV
          echo "Android project found at: $ANDROID_DIR"

      - name: Fix missing launcher icons
        run: |
          sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher|g' "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          sed -i 's|@mipmap/ic_launcher_round|@drawable/ic_launcher|g' "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTORA-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
