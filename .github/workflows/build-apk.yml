name: Build ARTORA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Artora web project
        run: |
          set -e

          APP_DIR=$(find . -type f -name "package.json" \
            ! -path "./.git/*" \
            ! -path "*/node_modules/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "Artora web project found at: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Build Artora web app
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Install Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init Artora com.artora.app --web-dir=dist
          fi

          npx cap add android
          npx cap copy android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload ARTORA APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTORA-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
