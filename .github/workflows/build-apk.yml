name: Build ARTORA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ARTORA project
        run: |
          mkdir -p project

          unzip -q artora.zip -d project

          NESTED_ZIP=$(find project -type f -name "artora.zip" -print -quit)

          if [ -n "$NESTED_ZIP" ]; then
            echo "Nested ZIP found: $NESTED_ZIP"
            mkdir -p project/app_source
            unzip -q "$NESTED_ZIP" -d project/app_source
          fi

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found."
            echo "Files found:"
            find project -type f | head -100
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $ANDROID_DIR"

      - name: Create launcher icons
        run: |
          mkdir -p "$ANDROID_DIR/app/src/main/res/mipmap"

          cat > "$ANDROID_DIR/app/src/main/res/mipmap/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          cp "$ANDROID_DIR/app/src/main/res/mipmap/ic_launcher.xml" \
             "$ANDROID_DIR/app/src/main/res/mipmap/ic_launcher_round.xml"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTORA-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
