name: Build ARTORA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ARTORA project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          unzip -o "$ZIP" -d extracted

          echo "Searching for package.json..."

          PACKAGE=$(find extracted -type f -name "package.json" \
            -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found after extraction."
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "ARTORA project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package.json

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build ARTORA web app
        working-directory: ${{ env.PROJECT_DIR
