name: Build ARTORA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ARTORA project
        shell: bash
        run: |
          set -e

          WEB_DIR=$(find . -type f -name "package.json" \
            -not -path "./.git/*" \
            -not -path "*/node_modules/*" \
            -exec dirname {} \; | head -n 1)

          if [ -z "$WEB_DIR" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $WEB_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: npm install

      - name: Build ARTORA
        working-directory: ${{ env.WEB_DIR }}
        run: npm run build

      - name: Install Capacitor
        working-directory: ${{ env.WEB_DIR }}
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        working-directory: ${{ env.WEB_DIR }}
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.artora.app',
            appName: 'ARTORA',
            webDir: 'dist',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Create Android project if needed
        working-directory: ${{ env.WEB_DIR }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync ARTORA
        working-directory: ${{ env.WEB_DIR }}
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.WEB_DIR }}/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTORA-APK
          path: ${{ env.WEB_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
