name: Build ARTORA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ARTORA ZIP
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP=$(find . -type f -name "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d project

          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -100

      - name: Find ARTORA web project
        shell: bash
        run: |
          set -e

          WEB_DIR=$(find project \
            -type f \
            -name "package.json" \
            ! -path "*/node_modules/*" \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$WEB_DIR" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          echo "ARTORA web project found at:"
          echo "$WEB_DIR"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: npm install

      - name: Install Capacitor
        working-directory: ${{ env.WEB_DIR }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        working-directory: ${{ env.WEB_DIR }}
        shell: bash
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.artora.app",
            "appName": "ARTORA",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          fi

      - name: Build ARTORA web app
        working-directory: ${{ env.WEB_DIR }}
       
